version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/tmp/uploads
      - ./faiss_indexes:/app/faiss_indexes
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "backend.tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./uploads:/tmp/uploads
      - ./faiss_indexes:/app/faiss_indexes
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
